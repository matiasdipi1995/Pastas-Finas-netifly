<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot</title>
    <link rel="icon" href="Logo.png">
    <link rel="stylesheet" href="css/styles.css">
    <script src="login.js"></script>
</head> 
<body class="body_2">
    <div class="contenedor_formulario">
        <img src="img/Logo.jpg" alt="Logo">
        <h2 class="titulo">BIENVENIDOS A LA ADMINISTRACION</h2>
        <form id="loginForm">
            <div>
                <label class="user">Usuario</label>
                <input type="text" name="user" required placeholder="ingrese el nombre de Usuario">    
            </div>
            <div>
                <label class="user">Contraseña</label>
                <input type="password" name="pass" required placeholder="ingrese la Contraseña">
            </div>
            <button type="submit">Ingresar</button>


    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();

        let usuario = document.querySelector("input[name='user']").value;
        let password = document.querySelector("input[name='pass']").value;

        if (usuario === "admin" && password === "1234") {
        localStorage.setItem("logueado", "admin");
        window.location.href = "admin.html";
        } 
        else if (usuario === "usuario" && password === "1234") {
        localStorage.setItem("logueado", "usuario");
        window.location.href = "index.html";
        } 
        else {
        alert("Usuario o contraseña incorrectos");
    }
    });
    </script>
</form>
</div>
</body>
</html>
